# Stable public Ubuntu Slim runner template.
name = "github-runner-ubuntu-slim"
dockerfile = "./Dockerfile"
path = ".."
cpu_count = 8
memory_mb = 8192
# Request 5% above the release minimum for filesystem overhead.
min_free_disk_mb = 21504
no_cache = false

# Local release policy (available space, MiB).
runnerd.min_free_disk_mb = 20480
