# GitHub runner Windows 11 Qiniu sandbox template.
#
# This tracked file is the stable build input. Use the Taskfile build target so
# qshell writes any generated template_id only to a temporary copy:
#   task template-build-windows-11
#
# Prefer a stable name over a committed environment-specific template_id.
# Windows templates cannot start from a Docker image; build on the provider's
# windows11 template instead and verify 50 GiB free after the build.

name = "github-runner-windows-11"
from_template = "windows11"
dockerfile = "./Dockerfile"
path = ".."
cpu_count = 8
memory_mb = 8192
# Request 5% above the release minimum for filesystem overhead.
min_free_disk_mb = 53760
ready_cmd = "ver"
no_cache = false

# Local release policy (available space, MiB).
runnerd.min_free_disk_mb = 51200
