name: Actions Runner Update

# Fenno owns scheduling and the upgrade branch. This manual fallback validates
# a proposal without competing with Fenno for branch/PR ownership.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-runner-verification
  cancel-in-progress: false

jobs:
  update:
    name: Verify latest stable Runner proposal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Resolve and verify latest stable Runner
        id: runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-actions-runner-pin.mjs

      - name: Regenerate Runner compatibility assertions
        if: steps.runner.outputs.changed == 'true'
        run: node scripts/generate-runner-image-compatibility.mjs

      - name: Validate all public template sources
        run: '"$(go env GOPATH)/bin/task" template-check-all'

      - name: Verify Windows pin consistency
        run: go test ./internal/sandboxrunner -run '^TestWindowsTemplateRunnerPinMatchesCommonPin$' -count=1

      - name: Record verification result
        env:
          VERSION: ${{ steps.runner.outputs.version }}
          CHANGED: ${{ steps.runner.outputs.changed }}
        run: |
          {
            echo "## Actions Runner verification"
            echo
            echo "Verified Runner ${VERSION}; source changes required: ${CHANGED}."
            echo "Fenno owns the upgrade PR. This run did not push or publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failure visibility
        if: failure()
        run: |
          {
            echo "## Actions Runner verification failed"
            echo
            echo "Inspect this run; no branch or template was published."
          } >> "$GITHUB_STEP_SUMMARY"
