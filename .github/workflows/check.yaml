name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile
      - name: Check UI internationalization
        run: cd ui && bun run check:i18n

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: staticcheck ./cmd/... ./internal/...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: |
          UNFORMATTED=$(gofmt -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "unformatted files (run: gofmt -w .):"
            echo "$UNFORMATTED"
            exit 1
          fi

  gofumpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: go install mvdan.cc/gofumpt@latest
      - run: |
          UNFORMATTED=$(gofumpt -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "unformatted files (run: gofumpt -w .):"
            echo "$UNFORMATTED"
            exit 1
          fi

  goimports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - run: |
          UNFORMATTED=$(goimports -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "unformatted files (run: goimports -w .):"
            echo "$UNFORMATTED"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: go vet ./cmd/... ./internal/...

  gomod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build && bun run test
      - run: GORACE=atexit_sleep_ms=0 go test -v -trimpath -failfast -race -cover -coverprofile=coverage.txt ./cmd/... ./internal/...

  catalog-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: runnerd_test
          POSTGRES_PASSWORD: runnerd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: runnerd_test
          MYSQL_ROOT_PASSWORD: runnerd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUNNERD_CATALOG_BACKEND_TESTS: "1"
      RUNNERD_POSTGRES_TEST_DSN: host=127.0.0.1 user=postgres password=runnerd dbname=runnerd_test port=5432 sslmode=disable
      RUNNERD_MYSQL_TEST_DSN: root:runnerd@tcp(127.0.0.1:3306)/runnerd_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Verify fresh schema, catalog matching, and audited mutations on PostgreSQL and MySQL
        run: go test ./internal/state -run 'Test(ApplyMutationWithAudit|CompareProfileMatches|FreshSchema|ScopedRunnerCatalogFreshSchema)SQLBackends' -count=1 -v

  ui-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile
      - run: cd ui && bunx playwright install --with-deps chromium
      - name: Run production UI smoke
        run: cd ui && bun run test:production
      - name: Upload production UI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - run: go build -trimpath -buildvcs=true -ldflags "-s -w" -o bin/runnerd ./cmd/runnerd

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
      - name: Build release archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=docker
      - name: Verify release archive contents
        run: |
          for archive in dist/*.tar.gz; do
            echo "checking $archive"
            if tar -tzf "$archive" | grep -E '(^|/)(README|LICENSE)'; then
              echo "$archive contains non-binary release files"
              exit 1
            fi
            test "$(tar -tzf "$archive" | wc -l | tr -d ' ')" = "1"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - name: Check service Dockerfile
        run: docker build --check -f Dockerfile .
      - name: Check public runner template matrix
        run: bash scripts/check-runner-template-matrix.sh
      - name: Check pinned runner image compatibility
        run: bash scripts/check-runner-image-compatibility.sh
      - name: Check Qiniu sandbox template Dockerfiles
        run: |
          for template in \
            github-runner-ubuntu-slim \
            github-runner-ubuntu-22.04 \
            github-runner-ubuntu-24.04 \
            github-runner-ubuntu-26.04
          do
            docker build --check --platform=linux/amd64 \
              -f "templates/$template/Dockerfile" \
              "templates/$template"
          done
